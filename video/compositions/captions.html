<template><style>@font-face{font-family:Inter;src:url('assets/fonts/InterVariable.woff2')}#root{position:absolute;inset:0;width:100%;height:100%;background:transparent}.caption{position:absolute;left:220px;right:220px;top:938px;height:84px;z-index:50;display:flex;align-items:center;justify-content:center}.caption p{background:#163431;color:white;font:29px/1.35 Inter,sans-serif;text-align:center;padding:12px 22px;border-radius:4px;max-width:1450px}</style><div id="root" data-composition-id="captions" data-width="1920" data-height="1080"><div id="caption-0" class="clip caption" data-start="0.642583" data-duration="3.217333" data-track-index="3" data-track-kind="captions"><p>An invoice can pass a calculation check and still contain the wrong</p></div><div id="caption-1" class="clip caption" data-start="3.894916" data-duration="4.004334" data-track-index="3" data-track-kind="captions"><p>numbers. I built Document Verification Lab to see what an independent</p></div><div id="caption-2" class="clip caption" data-start="7.934250" data-duration="2.696500" data-track-index="3" data-track-kind="captions"><p>visual check adds to document automation.</p></div><div id="caption-3" class="clip caption" data-start="10.665750" data-duration="3.286750" data-track-index="3" data-track-kind="captions"><p>Start with this generated invoice and its payment details.</p></div><div id="caption-4" class="clip caption" data-start="13.987500" data-duration="3.680291" data-track-index="3" data-track-kind="captions"><p>For a controlled stress test, I multiply every amount by ten.</p></div><div id="caption-5" class="clip caption" data-start="17.702791" data-duration="3.356209" data-track-index="3" data-track-kind="captions"><p>Subtotal, shipping and tax still add up to the total, so the</p></div><div id="caption-6" class="clip caption" data-start="21.094000" data-duration="3.402500" data-track-index="3" data-track-kind="captions"><p>arithmetic check passes. Comparing the extracted values with the</p></div><div id="caption-7" class="clip caption" data-start="24.531500" data-duration="2.233500" data-track-index="3" data-track-kind="captions"><p>original page reveals the problem.</p></div><div id="caption-8" class="clip caption" data-start="26.800000" data-duration="5.393250" data-track-index="3" data-track-kind="captions"><p>OpenBMB&#x27;s MiniCPM OCR Jev takes the source image, candidate text, and a</p></div><div id="caption-9" class="clip caption" data-start="32.228250" data-duration="1.724250" data-track-index="3" data-track-kind="captions"><p>rendered copy of that text.</p></div><div id="caption-10" class="clip caption" data-start="33.987500" data-duration="3.738166" data-track-index="3" data-track-kind="captions"><p>Its two-billion-parameter classifier returns a consistency score.</p></div><div id="caption-11" class="clip caption" data-start="37.760666" data-duration="3.101542" data-track-index="3" data-track-kind="captions"><p>Higher means stronger predicted agreement with the pixels.</p></div><div id="caption-12" class="clip caption" data-start="40.897208" data-duration="3.228917" data-track-index="3" data-track-kind="captions"><p>Here, the score drops from about zero point nine eight to zero</p></div><div id="caption-13" class="clip caption" data-start="44.161125" data-duration="4.004333" data-track-index="3" data-track-kind="captions"><p>point zero zero seven. I also ran real OCR on one hundred</p></div><div id="caption-14" class="clip caption" data-start="48.200458" data-duration="4.050667" data-track-index="3" data-track-kind="captions"><p>and twenty generated invoices. Forty set the review threshold; eighty</p></div><div id="caption-15" class="clip caption" data-start="52.286125" data-duration="3.124708" data-track-index="3" data-track-kind="captions"><p>were held out. Rules caught all three test errors.</p></div><div id="caption-16" class="clip caption" data-start="55.445833" data-duration="3.738125" data-track-index="3" data-track-kind="captions"><p>Adding the verifier sent thirteen correct results to review, without</p></div><div id="caption-17" class="clip caption" data-start="59.218958" data-duration="3.113167" data-track-index="3" data-track-kind="captions"><p>catching another error. The separate stress tests tell a different</p></div><div id="caption-18" class="clip caption" data-start="62.367125" data-duration="4.027500" data-track-index="3" data-track-kind="captions"><p>story. All twenty-four internally consistent currency and amount changes</p></div><div id="caption-19" class="clip caption" data-start="66.429625" data-duration="3.749708" data-track-index="3" data-track-kind="captions"><p>passed the rules. The visual verifier flagged every one.</p></div><div id="caption-20" class="clip caption" data-start="70.214333" data-duration="3.471958" data-track-index="3" data-track-kind="captions"><p>That gives us a specific capability to investigate on representative</p></div><div id="caption-21" class="clip caption" data-start="73.721291" data-duration="3.888625" data-track-index="3" data-track-kind="captions"><p>documents. For supplier-invoice workflows, I would keep the source</p></div><div id="caption-22" class="clip caption" data-start="77.644916" data-duration="3.761292" data-track-index="3" data-track-kind="captions"><p>evidence attached, measure the extra errors caught per review, and check</p></div><div id="caption-23" class="clip caption" data-start="81.441208" data-duration="3.552958" data-track-index="3" data-track-kind="captions"><p>purchase orders separately. You can inspect every case and change the</p></div><div id="caption-24" class="clip caption" data-start="85.029166" data-duration="1.735834" data-track-index="3" data-track-kind="captions"><p>threshold in the open lab.</p></div><div id="caption-25" class="clip caption" data-start="86.800000" data-duration="2.510666" data-track-index="3" data-track-kind="captions"><p>The code, inputs and results are public.</p></div></div><script>const tl=gsap.timeline({paused:true});window.__timelines['captions']=tl;</script></template>
