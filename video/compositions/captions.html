<template><style>@font-face{font-family:Inter;src:url('assets/fonts/InterVariable.woff2')}#root{position:absolute;inset:0;width:100%;height:100%;background:transparent}.caption{position:absolute;left:220px;right:220px;top:938px;height:84px;z-index:50;display:flex;align-items:center;justify-content:center}.caption p{background:#163431;color:white;font:29px/1.35 Inter,sans-serif;text-align:center;padding:12px 22px;border-radius:4px;max-width:1450px}</style><div id="root" data-composition-id="captions" data-width="1920" data-height="1080"><div id="caption-0" class="clip caption" data-start="0.642583" data-duration="3.217333" data-track-index="3" data-track-kind="captions"><p>An invoice can pass a calculation check and still contain the wrong</p></div><div id="caption-1" class="clip caption" data-start="3.894916" data-duration="4.004334" data-track-index="3" data-track-kind="captions"><p>numbers I built Document Verification Lab to see what an independent</p></div><div id="caption-2" class="clip caption" data-start="7.934250" data-duration="3.807583" data-track-index="3" data-track-kind="captions"><p>visual check adds to document automation Start with this generated</p></div><div id="caption-3" class="clip caption" data-start="11.776833" data-duration="4.525208" data-track-index="3" data-track-kind="captions"><p>invoice and its payment details For a controlled stress test I multiply</p></div><div id="caption-4" class="clip caption" data-start="16.337041" data-duration="3.749709" data-track-index="3" data-track-kind="captions"><p>every amount by ten Subtotal shipping and tax still add up to</p></div><div id="caption-5" class="clip caption" data-start="20.121750" data-duration="4.154833" data-track-index="3" data-track-kind="captions"><p>the total so the arithmetic check passes Comparing the extracted values</p></div><div id="caption-6" class="clip caption" data-start="24.311583" data-duration="5.265917" data-track-index="3" data-track-kind="captions"><p>with the original page reveals the problem OpenBMB&#x27;s MiniCPM OCR Jev</p></div><div id="caption-7" class="clip caption" data-start="29.612500" data-duration="3.529833" data-track-index="3" data-track-kind="captions"><p>takes the source image candidate text and a rendered copy of that</p></div><div id="caption-8" class="clip caption" data-start="33.177333" data-duration="4.548333" data-track-index="3" data-track-kind="captions"><p>text Its two-billion-parameter classifier returns a consistency score</p></div><div id="caption-9" class="clip caption" data-start="37.760666" data-duration="3.934875" data-track-index="3" data-track-kind="captions"><p>Higher means stronger predicted agreement with the pixels Here the score</p></div><div id="caption-10" class="clip caption" data-start="41.730541" data-duration="3.333084" data-track-index="3" data-track-kind="captions"><p>drops from about zero point nine eight to zero point zero zero</p></div><div id="caption-11" class="clip caption" data-start="45.098625" data-duration="3.888583" data-track-index="3" data-track-kind="captions"><p>seven I also ran real OCR on one hundred and twenty generated</p></div><div id="caption-12" class="clip caption" data-start="49.022208" data-duration="4.478917" data-track-index="3" data-track-kind="captions"><p>invoices Forty set the review threshold eighty were held out Rules</p></div><div id="caption-13" class="clip caption" data-start="53.536125" data-duration="4.004333" data-track-index="3" data-track-kind="captions"><p>caught all three test errors Adding the verifier sent thirteen correct</p></div><div id="caption-14" class="clip caption" data-start="57.575458" data-duration="3.842333" data-track-index="3" data-track-kind="captions"><p>results to review without catching another error The separate stress</p></div><div id="caption-15" class="clip caption" data-start="61.452791" data-duration="3.356167" data-track-index="3" data-track-kind="captions"><p>tests tell a different story All twenty-four internally consistent</p></div><div id="caption-16" class="clip caption" data-start="64.843958" data-duration="4.444167" data-track-index="3" data-track-kind="captions"><p>currency and amount changes passed the rules The visual verifier flagged</p></div><div id="caption-17" class="clip caption" data-start="69.323125" data-duration="3.761333" data-track-index="3" data-track-kind="captions"><p>every one That gives us a specific capability to investigate on</p></div><div id="caption-18" class="clip caption" data-start="73.119458" data-duration="4.027500" data-track-index="3" data-track-kind="captions"><p>representative documents For supplier-invoice workflows I would keep the</p></div><div id="caption-19" class="clip caption" data-start="77.181958" data-duration="3.981167" data-track-index="3" data-track-kind="captions"><p>source evidence attached measure the extra errors caught per review and</p></div><div id="caption-20" class="clip caption" data-start="81.198125" data-duration="3.715000" data-track-index="3" data-track-kind="captions"><p>check purchase orders separately You can inspect every case and change</p></div><div id="caption-21" class="clip caption" data-start="84.948125" data-duration="3.587708" data-track-index="3" data-track-kind="captions"><p>the threshold in the open lab The code inputs and results are</p></div><div id="caption-22" class="clip caption" data-start="88.570833" data-duration="0.739833" data-track-index="3" data-track-kind="captions"><p>public</p></div></div><script>const tl=gsap.timeline({paused:true});window.__timelines['captions']=tl;</script></template>
